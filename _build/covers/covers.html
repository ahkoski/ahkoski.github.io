<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<style>
@font-face{font-family:"Bricolage";src:url(../../fonts/bricolage-grotesque-latin-800-normal.woff2) format("woff2");font-weight:800}
@font-face{font-family:"Atkinson";src:url(../../fonts/atkinson-hyperlegible-latin-700-normal.woff2) format("woff2");font-weight:700}
:root{--plum:#3A1747;--plum2:#4E2160;--coral:#FF6B6B;--gold:#FFC93C;--mint:#5EE6C8;--lilac:#FDF4FF;--berry:#A3216B}
body{margin:0;background:#ddd;display:grid;gap:30px;padding:30px;width:1200px}
.cover{width:1200px;height:675px;position:relative;overflow:hidden;border-radius:0}
.cover svg{position:absolute;inset:0;width:100%;height:100%}
.label{position:absolute;left:64px;bottom:60px;max-width:560px!important;font-family:Bricolage;font-weight:800;font-size:78px;line-height:.95;letter-spacing:-2px;max-width:640px}
.tag{position:absolute;left:64px;top:56px;font-family:Atkinson;font-weight:700;font-size:26px;padding:8px 18px;border-radius:999px}
</style></head><body>

<!-- 1 Adapting to Change: arcade -->
<div class="cover" id="c1" style="background:var(--coral)">
<svg viewBox="0 0 1200 675">
  <circle cx="1080" cy="620" r="260" fill="#FF8585"/>
  <g transform="translate(700,70)">
    <rect x="0" y="0" width="380" height="560" rx="34" fill="var(--plum)"/>
    <rect x="30" y="40" width="320" height="250" rx="18" fill="var(--gold)"/>
    <rect x="44" y="54" width="292" height="222" rx="10" fill="var(--plum2)"/>
    <!-- racetrack -->
    <path d="M80 230 Q80 110 190 110 Q300 110 300 170 Q300 230 230 230 L150 230" fill="none" stroke="var(--mint)" stroke-width="16" stroke-linecap="round" stroke-dasharray="2 26"/>
    <rect x="90" y="214" width="28" height="22" rx="4" fill="var(--gold)"/>
    <g fill="var(--coral)"><rect x="276" y="96" width="10" height="10"/><rect x="286" y="106" width="10" height="10"/><rect x="276" y="116" width="10" height="10"/><rect x="286" y="86" width="10" height="10"/></g>
    <!-- hearts -->
    <g fill="var(--coral)"><rect x="70" y="76" width="16" height="16"/><rect x="94" y="76" width="16" height="16"/><rect x="118" y="76" width="16" height="16"/></g>
    <rect x="30" y="330" width="320" height="120" rx="20" fill="var(--plum2)"/>
    <rect x="70" y="378" width="80" height="24" rx="6" fill="var(--lilac)"/><rect x="98" y="350" width="24" height="80" rx="6" fill="var(--lilac)"/>
    <circle cx="240" cy="372" r="22" fill="var(--gold)"/><circle cx="295" cy="410" r="22" fill="var(--mint)"/>
    <rect x="150" y="480" width="80" height="20" rx="6" fill="var(--gold)"/>
  </g>
  <g fill="var(--gold)"><rect x="620" y="110" width="18" height="18"/><rect x="640" y="90" width="18" height="18"/><rect x="600" y="90" width="18" height="18"/><rect x="620" y="70" width="18" height="18"/></g>
</svg>
<span class="tag" style="background:var(--plum);color:var(--gold)">Gamified eLearning</span>
<div class="label" style="color:var(--plum)">Adapting<br>to Change</div>
</div>

<!-- 2 Foundations of AI: circuit lightbulb -->
<div class="cover" id="c2" style="background:var(--plum)">
<svg viewBox="0 0 1200 675">
  <circle cx="900" cy="300" r="250" fill="var(--plum2)"/>
  <g fill="none" stroke="var(--mint)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round">
    <path d="M900 120 C800 120 750 190 750 260 C750 330 800 360 820 420 L980 420 C1000 360 1050 330 1050 260 C1050 190 1000 120 900 120 Z" stroke="var(--gold)" stroke-width="14"/>
    <path d="M840 460 H960 M855 500 H945" stroke="var(--gold)" stroke-width="14"/>
    <path d="M900 420 V320 L860 280 M900 320 L940 280 M860 280 V230 M940 280 V220"/>
    <path d="M750 260 H700 V180 H680 M1050 260 H1140 M1050 210 H1110 V140 M800 360 L760 420"/>
  </g>
  <g fill="var(--coral)"><circle cx="860" cy="226" r="14"/><circle cx="940" cy="214" r="14"/><circle cx="680" cy="180" r="12"/><circle cx="760" cy="420" r="12"/><circle cx="1110" cy="140" r="12"/></g>
  <g fill="var(--gold)"><path d="M1120 470 l10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10z"/><path d="M700 90 l7 18 18 7 -18 7 -7 18 -7 -18 -18 -7 18 -7z"/></g>
</svg>
<span class="tag" style="background:var(--mint);color:var(--plum)">AI literacy</span>
<div class="label" style="color:var(--gold)">Foundations of AI in the Workplace</div>
</div>

<!-- 3 Leading Through Change: Bridges path -->
<div class="cover" id="c3" style="background:var(--mint)">
<svg viewBox="0 0 1200 675">
  <circle cx="1120" cy="80" r="180" fill="#7FEDD5"/>
  <g transform="translate(60,-150)"><path d="M560 470 Q700 300 850 400 T1080 250" fill="none" stroke="var(--plum)" stroke-width="22" stroke-linecap="round"/>
  <path d="M560 470 Q700 300 850 400 T1080 250" fill="none" stroke="var(--lilac)" stroke-width="4" stroke-dasharray="14 18"/>
  <g>
    <circle cx="610" cy="418" r="40" fill="var(--coral)"/><circle cx="850" cy="400" r="40" fill="var(--gold)"/><circle cx="1060" cy="270" r="40" fill="var(--lilac)"/>
  </g>
  <g font-family="Atkinson" font-weight="700" font-size="24" fill="var(--plum)" text-anchor="middle">
    <text x="610" y="500">Ending</text><text x="850" y="480">Neutral zone</text><text x="1060" y="208">Beginning</text>
  </g>
  <!-- people dots -->
  <g fill="var(--plum)"><circle cx="610" cy="404" r="9"/><rect x="600" y="414" width="20" height="22" rx="8"/><circle cx="850" cy="386" r="9"/><rect x="840" y="396" width="20" height="22" rx="8"/><circle cx="1060" cy="256" r="9"/><rect x="1050" y="266" width="20" height="22" rx="8"/></g></g>
  <g fill="var(--coral)"><path d="M560 120 l10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10z"/></g>
</svg>
<span class="tag" style="background:var(--plum);color:var(--mint)">Leadership development</span>
<div class="label" style="color:var(--plum)">Leading Through Change &amp; Transition</div>
</div>

<!-- 4 ZenGRC: in-app guidance -->
<div class="cover" id="c4" style="background:var(--gold)">
<svg viewBox="0 0 1200 675">
  <circle cx="160" cy="80" r="160" fill="#FFD666"/>
  <g transform="translate(640,90)">
    <rect width="500" height="360" rx="24" fill="var(--lilac)"/>
    <rect width="500" height="52" rx="24" fill="var(--plum)"/><rect y="28" width="500" height="24" fill="var(--plum)"/>
    <g fill="var(--coral)"><circle cx="34" cy="26" r="9"/></g><circle cx="60" cy="26" r="9" fill="var(--gold)"/><circle cx="86" cy="26" r="9" fill="var(--mint)"/>
    <rect x="28" y="84" width="120" height="250" rx="12" fill="#F3E4F7"/>
    <rect x="170" y="84" width="300" height="40" rx="10" fill="#F3E4F7"/>
    <rect x="170" y="140" width="140" height="110" rx="12" fill="#F3E4F7"/><rect x="330" y="140" width="140" height="110" rx="12" fill="#F3E4F7"/>
    <!-- bar chart up -->
    <g fill="var(--berry)"><rect x="190" y="210" width="22" height="26" rx="4"/><rect x="222" y="190" width="22" height="46" rx="4"/><rect x="254" y="164" width="22" height="72" rx="4"/></g>
  </g>
  <!-- pop-up guide -->
  <g transform="translate(560,300)">
    <rect width="300" height="170" rx="22" fill="var(--plum)"/>
    <rect x="22" y="22" width="90" height="34" rx="17" fill="var(--coral)"/>
    <text x="67" y="46" text-anchor="middle" font-family="Atkinson" font-weight="700" font-size="20" fill="var(--plum)">NEW!</text>
    <rect x="22" y="74" width="240" height="14" rx="7" fill="var(--lilac)"/><rect x="22" y="100" width="180" height="14" rx="7" fill="#B9A3C2"/>
    <rect x="180" y="128" width="98" height="28" rx="14" fill="var(--mint)"/>
    <path d="M300 60 L330 80 L300 100 Z" fill="var(--plum)"/>
  </g>
  <!-- badge -->
  <circle cx="1120" cy="110" r="44" fill="var(--coral)"/><text x="1120" y="126" text-anchor="middle" font-family="Bricolage" font-weight="800" font-size="44" fill="var(--plum)">!</text>
  <!-- cursor -->
  <path d="M820 470 l0 70 18 -18 14 30 14 -6 -14 -30 26 -2z" fill="var(--lilac)" stroke="var(--plum)" stroke-width="6" stroke-linejoin="round"/>
</svg>
<span class="tag" style="background:var(--plum);color:var(--gold)">Product adoption</span>
<div class="label" style="color:var(--plum)">Making new features stick</div>
</div>

<!-- 5 Assistant Enrichment: land of DMS -->
<div class="cover" id="c5" style="background:var(--berry)">
<svg viewBox="0 0 1200 675">
  <circle cx="1000" cy="170" r="110" fill="var(--gold)"/>
  <path d="M600 675 L860 330 L1120 675 Z" fill="var(--gold)"/>
  <path d="M860 330 L1120 675 L980 675 Z" fill="#E0A82A"/>
  <path d="M760 675 L940 430 L1120 675 Z" fill="#FFD666" opacity=".0"/>
  <g fill="var(--plum)"><rect x="840" y="520" width="40" height="60" rx="6"/></g>
  <path d="M520 675 L680 470 L840 675 Z" fill="#FFD666"/>
  <path d="M680 470 L840 675 L740 675 Z" fill="#E0B23F"/>
  <!-- scroll -->
  <g transform="translate(940,430) rotate(-8)">
    <rect x="0" y="0" width="190" height="120" rx="10" fill="var(--lilac)"/>
    <rect x="-14" y="-8" width="24" height="136" rx="12" fill="var(--coral)"/><rect x="180" y="-8" width="24" height="136" rx="12" fill="var(--coral)"/>
    <rect x="30" y="30" width="130" height="10" rx="5" fill="var(--berry)"/><rect x="30" y="54" width="100" height="10" rx="5" fill="var(--berry)"/><rect x="30" y="78" width="120" height="10" rx="5" fill="var(--berry)"/>
  </g>
  <g fill="var(--mint)"><path d="M640 120 l10 26 26 10 -26 10 -10 26 -10 -26 -26 -10 26 -10z"/></g>
</svg>
<span class="tag" style="background:var(--gold);color:var(--plum)">Gamified skills program</span>
<div class="label" style="color:var(--lilac)">Assistant Enrichment Program</div>
</div>

</body></html>
